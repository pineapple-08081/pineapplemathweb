<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>數學練習場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFBF5;
    --paper-dark:#F1F0E6;
    --grid:#CFE0EE;
    --ink:#1E2A4A;
    --ink-soft:#5C6785;
    --red:#D6432D;
    --green:#2E7D5B;
    --gold:#E4A63A;
    --card-border:#1E2A4A;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1626; --paper-dark:#131B2E; --grid:#22314F;
      --ink:#F3F1E7; --ink-soft:#AEB6CF; --red:#FF6B52; --green:#4FCE96;
      --gold:#F2C15A; --card-border:#3A4A72;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1626; --paper-dark:#131B2E; --grid:#22314F;
    --ink:#F3F1E7; --ink-soft:#AEB6CF; --red:#FF6B52; --green:#4FCE96;
    --gold:#F2C15A; --card-border:#3A4A72;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'Space Grotesk','Noto Sans TC',sans-serif; font-variant-numeric: tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px;}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:46px;height:46px;border-radius:10px;border:2.5px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;background:var(--paper-dark);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;
    transform:rotate(-4deg); flex-shrink:0;
  }
  .brand h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.02em;}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .top-right{display:flex;align-items:center;gap:8px;}

  .back-btn, .ghost-btn{
    display:none;align-items:center;gap:6px;background:none;border:2px solid var(--card-border);
    border-radius:999px;padding:8px 16px 8px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .back-btn:hover, .ghost-btn:hover{background:var(--paper-dark);}

  .sync-pill{
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--card-border);
    color:var(--ink-soft);
  }
  .sync-pill.on{color:var(--green);border-color:var(--green);}
  .sync-pill.off{color:var(--red);border-color:var(--red);}

  .screen{display:none;}
  .screen.show{display:block;}

  /* ---------- Login ---------- */
  #login .panel{max-width:420px;margin:40px auto 0;text-align:center;}
  #login h2{margin:0 0 6px;font-size:19px;font-weight:900;}
  #login p.sub{margin:0 0 20px;font-size:13px;color:var(--ink-soft);}
  #nameInput{
    width:100%;font-size:18px;font-weight:700;padding:12px 14px;border-radius:10px;
    border:2px solid var(--card-border);background:var(--paper);color:var(--ink);text-align:center;
  }
  .go-btn{
    margin-top:14px;width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:10px;
    padding:13px;font-weight:700;font-size:16px;cursor:pointer;
  }
  .go-btn:hover{opacity:.88;}
  .login-foot{margin-top:22px;font-size:12.5px;color:var(--ink-soft);}
  .login-foot button{background:none;border:none;text-decoration:underline;cursor:pointer;color:var(--ink-soft);font-size:12.5px;padding:0;}

  /* ---------- Home ---------- */
  #home .lede{max-width:520px;margin:0 0 8px;color:var(--ink-soft);font-size:15px;line-height:1.7;}
  .welcome{font-size:14px;margin-bottom:18px;color:var(--ink-soft);}
  .welcome b{color:var(--ink);}
  .badge-chip{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid var(--card-border);font-size:12.5px;margin-left:6px;}

  .stamp{
    display:inline-flex;align-items:center;gap:6px;
    border:2px solid var(--red);color:var(--red);border-radius:8px;
    padding:3px 10px;font-weight:700;font-size:12.5px;transform:rotate(-3deg);
    margin-bottom:14px;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}

  .card{
    position:relative; background:var(--paper-dark); border:2px solid var(--card-border);
    border-radius:var(--radius); padding:18px 16px 16px; cursor:pointer; text-align:left;
    transition:transform .12s ease, box-shadow .12s ease; box-shadow:4px 4px 0 var(--card-border);
  }
  .card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--card-border);}
  .card:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--card-border);}
  .card .tag{
    position:absolute;top:-10px;right:14px;font-size:11px;font-weight:700;
    background:var(--gold);color:#241a03;padding:2px 8px;border-radius:6px;border:2px solid var(--card-border);
  }
  .card .icon{
    width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;margin-bottom:10px;
    border:2px solid var(--card-border);
  }
  .card h3{margin:0 0 4px;font-size:16px;font-weight:900;}
  .card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}

  /* ---------- Difficulty picker (modal-ish inline) ---------- */
  #diffPicker{display:none;margin-top:18px;}
  #diffPicker .panel{padding:20px;}
  #diffPicker h3{margin:0 0 12px;font-size:16px;}
  .diff-choices{display:flex;gap:10px;flex-wrap:wrap;}
  .diff-choices button{
    flex:1;min-width:110px;border:2px solid var(--card-border);background:var(--paper);border-radius:12px;
    padding:14px 10px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .diff-choices button:hover{background:var(--gold);}

  /* ---------- Game screen ---------- */
  .panel{
    background:var(--paper-dark);border:2px solid var(--card-border);border-radius:18px;
    padding:26px 24px 22px;position:relative;box-shadow:6px 6px 0 var(--card-border);
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .mode-title{display:flex;align-items:center;gap:10px;}
  .mode-title .icon{
    width:36px;height:36px;border-radius:9px;border:2px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk',sans-serif;
  }
  .mode-title h2{margin:0;font-size:18px;font-weight:900;}
  .diff-tag{font-size:12px;font-weight:700;color:var(--ink-soft);border:1.5px solid var(--card-border);border-radius:999px;padding:3px 10px;}

  .timerbar-wrap{height:10px;border-radius:999px;background:var(--paper);border:1.5px solid var(--card-border);overflow:hidden;margin-bottom:16px;}
  .timerbar{height:100%;width:100%;background:var(--green);transition:width 1s linear, background .3s ease;}
  .timerbar.warn{background:var(--gold);}
  .timerbar.danger{background:var(--red);}

  .stats{display:flex;gap:18px;margin-bottom:16px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
  .stats b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:15px;}

  .stage{
    background:var(--paper);border:1.5px dashed var(--grid);border-radius:14px;
    padding:36px 20px;text-align:center;min-height:170px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    position:relative;overflow:hidden;
  }
  .problem{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(28px,6vw,42px);letter-spacing:.01em;}
  .problem sup{font-size:.55em;}
  .hint{font-size:12.5px;color:var(--ink-soft);}

  .answer-row{display:flex;align-items:center;gap:10px;}
  .answer-row input{
    font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;
    width:150px;text-align:center;padding:10px 8px;border-radius:10px;
    border:2px solid var(--card-border);background:var(--paper-dark);color:var(--ink);
  }
  .answer-row input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .submit-btn{
    background:var(--ink);color:var(--paper);border:none;border-radius:10px;
    padding:11px 20px;font-weight:700;font-size:15px;cursor:pointer;
  }
  .submit-btn:hover{opacity:.88;}

  .stamp-fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .stamp-fx span{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;
    border:5px solid currentColor;border-radius:14px;padding:6px 22px;
    transform:rotate(-10deg) scale(0);opacity:0;
  }
  .stamp-fx.show span{animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) forwards;}
  @keyframes stampIn{
    0%{transform:rotate(-10deg) scale(2.2);opacity:0;}
    60%{transform:rotate(-10deg) scale(.92);opacity:1;}
    100%{transform:rotate(-10deg) scale(1);opacity:1;}
  }
  .correct-color{color:var(--green);}
  .wrong-color{color:var(--red);}

  .feedback-line{min-height:20px;font-size:13.5px;font-weight:700;}
  .feedback-line.correct{color:var(--green);}
  .feedback-line.wrong{color:var(--red);}

  .numpad{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;max-width:280px;margin-left:auto;margin-right:auto;}
  .numpad button{
    padding:13px 0;border-radius:10px;border:2px solid var(--card-border);background:var(--paper);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;cursor:pointer;color:var(--ink);
  }
  .numpad button:active{background:var(--gold);}
  .numpad button.full{grid-column:1 / -1;}

  .quit-row{margin-top:16px;text-align:center;}
  .quit-row button{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:12.5px;cursor:pointer;}

  /* ---------- Result ---------- */
  #result .panel{max-width:460px;margin:0 auto;text-align:center;}
  .badge-big{
    width:110px;height:110px;border-radius:50%;border:4px solid var(--card-border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px auto 14px;
    background:var(--paper);
  }
  .badge-big .emoji{font-size:38px;}
  .badge-big .label{font-size:13px;font-weight:900;margin-top:2px;}
  .score-big{font-family:'Space Grotesk',sans-serif;font-size:46px;font-weight:700;margin:4px 0;}
  .result-stats{display:flex;justify-content:center;gap:20px;margin:14px 0 18px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
  .result-stats b{color:var(--ink);font-family:'Space Grotesk',sans-serif;}
  .result-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .result-btns button{border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;border:2px solid var(--card-border);}
  .result-btns .primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .result-btns .secondary{background:var(--paper);color:var(--ink);}
  .save-note{margin-top:14px;font-size:12px;color:var(--ink-soft);}

  /* ---------- Admin ---------- */
  #adminGate .panel{max-width:380px;margin:40px auto 0;text-align:center;}
  #adminGate input{width:100%;font-size:16px;padding:11px;border-radius:10px;border:2px solid var(--card-border);text-align:center;margin-top:8px;}
  .admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .admin-toolbar input, .admin-toolbar select{
    padding:8px 10px;border-radius:8px;border:2px solid var(--card-border);background:var(--paper);color:var(--ink);font-size:13px;
  }
  .admin-summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--ink-soft);}
  .admin-summary b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:16px;}
  table.records{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.records th, table.records td{border-bottom:1.5px solid var(--grid);padding:7px 8px;text-align:left;white-space:nowrap;}
  table.records th{color:var(--ink-soft);font-weight:700;}
  .table-scroll{overflow-x:auto;border:1.5px solid var(--card-border);border-radius:10px;}
  .export-btn{margin-top:14px;border:2px solid var(--card-border);background:var(--paper);border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;}

  .best-line{margin-top:16px;font-size:12.5px;color:var(--ink-soft);text-align:center;}

  @media (max-width:520px){
    .panel{padding:20px 14px 18px;}
    .stats{gap:12px;}
    .numpad{display:grid;}
  }
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="brand-mark">+−</div>
      <div>
        <h1>數學練習場</h1>
        <p>限時 200 秒，練出心算反應力</p>
      </div>
    </div>
    <div class="top-right">
      <span class="sync-pill" id="syncPill">檢查同步中…</span>
      <button class="back-btn" id="backBtn">← 回選單</button>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="screen show" id="login">
    <div class="panel">
      <h2>開始之前，先告訴我你的名字</h2>
      <p class="sub">用同一個名字登入，就能看到你之前的紀錄喔！</p>
      <input id="nameInput" type="text" maxlength="12" placeholder="例如：小明" autocomplete="off">
      <button class="go-btn" id="loginBtn">登入 / 查詢紀錄</button>
      <div id="loginHistory"></div>
      <div class="login-foot"><button id="adminLink" type="button">教師後台</button></div>
    </div>
  </div>

  <!-- ADMIN PASSWORD GATE -->
  <div class="screen" id="adminGate">
    <div class="panel">
      <h2 style="margin:0 0 6px;font-size:18px;">教師後台</h2>
      <p class="sub" style="margin:0 0 4px;">請輸入後台密碼</p>
      <input id="adminPass" type="password" placeholder="密碼">
      <button class="go-btn" id="adminEnterBtn">進入後台</button>
      <div class="login-foot"><button id="adminBackBtn" type="button">← 返回登入</button></div>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div class="screen" id="admin">
    <div class="panel">
      <div class="panel-head">
        <h2 style="margin:0;font-size:18px;">教師後台 — 遊玩紀錄</h2>
      </div>
      <div class="admin-summary" id="adminSummary"></div>
      <div class="admin-toolbar">
        <input id="adminFilterName" type="text" placeholder="搜尋姓名…">
        <select id="adminFilterMode"><option value="">全部關卡</option></select>
        <button class="export-btn" id="adminRefresh" type="button">重新整理</button>
      </div>
      <div class="table-scroll">
        <table class="records">
          <thead><tr>
            <th>時間</th><th>姓名</th><th>關卡</th><th>難度</th><th>分數</th><th>牌位</th><th>答對</th><th>答錯</th><th>總題數</th>
          </tr></thead>
          <tbody id="adminRows"></tbody>
        </table>
      </div>
      <button class="export-btn" id="adminExport" type="button">匯出 CSV</button>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen" id="home">
    <div class="stamp">✓ 越練越快</div>
    <div class="welcome" id="welcomeLine"></div>
    <p class="lede">選一個關卡，再選難度，200 秒倒數馬上開始！答對 +2 分、答錯 −1 分，看看能拿到哪一個牌位。</p>
    <div class="grid" id="modeGrid"></div>

    <div id="diffPicker">
      <div class="panel">
        <h3 id="diffPickerTitle"></h3>
        <div class="diff-choices" id="diffChoices"></div>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div class="panel">
      <div class="panel-head">
        <div class="mode-title">
          <div class="icon" id="gIcon"></div>
          <h2 id="gTitle"></h2>
        </div>
        <span class="diff-tag" id="gDiffTag"></span>
      </div>

      <div class="timerbar-wrap"><div class="timerbar" id="timerBar"></div></div>

      <div class="stats">
        <div>剩餘時間 <b id="stTime">200</b> 秒</div>
        <div>分數 <b id="stScoreVal">0</b></div>
        <div>答對 <b id="stCorrect">0</b></div>
        <div>答錯 <b id="stWrong">0</b></div>
      </div>

      <div class="stage">
        <div class="stamp-fx" id="stampFx"><span id="stampFxText"></span></div>
        <div class="problem" id="problem"></div>
        <div class="hint" id="hint"></div>
        <div class="answer-row">
          <input id="answerInput" type="text" inputmode="decimal" autocomplete="off" placeholder="?">
          <button class="submit-btn" id="submitBtn">確認</button>
        </div>
        <div class="feedback-line" id="feedback"></div>
      </div>

      <div class="numpad" id="numpad"></div>
      <div class="quit-row"><button id="quitBtn" type="button">提早結束這一關</button></div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="result">
    <div class="panel">
      <div class="badge-big" id="badgeBig"></div>
      <div class="score-big num" id="finalScore">0</div>
      <div style="font-size:13px;color:var(--ink-soft);">最終分數</div>
      <div class="result-stats">
        <div>答對 <b id="rCorrect">0</b></div>
        <div>答錯 <b id="rWrong">0</b></div>
        <div>正確率 <b id="rAcc">0%</b></div>
      </div>
      <div class="result-btns">
        <button class="primary" id="playAgainBtn">再玩一次</button>
        <button class="secondary" id="toHomeBtn">回選單</button>
      </div>
      <div class="save-note" id="saveNote"></div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     設定區 — 請依需要修改
     ========================================================= */
  // 把 Google Apps Script 部署後的網頁應用程式網址貼在這裡，即可開啟雲端同步。
  // 留空 "" 則只會存在這台裝置的瀏覽器裡（本機模式）。
  const API_URL = "https://script.google.com/macros/s/AKfycby9AXxpEyEL5yZ8IlRIWuyV3UwJkBrNMOOk-iod62pJ_6IQacFGBA2IXGPo0SNoyiaF/exec";
  // 教師後台密碼，建議修改成只有你知道的密碼。
  const ADMIN_PASSWORD = "0000";
  // 每一關的時間限制（秒）
  const ROUND_SECONDS = 200;
  // 牌位門檻，由高到低
  const BADGES = [
    {min:200, name:'大師', emoji:'🏆'},
    {min:150, name:'鑽石', emoji:'💎'},
    {min:100, name:'金牌', emoji:'🥇'},
    {min:50,  name:'銀牌', emoji:'🥈'},
    {min:30,  name:'銅牌', emoji:'🥉'},
  ];

  /* ---------------- helpers ---------------- */
  const $ = sel => document.querySelector(sel);
  const randInt = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
  const choice = arr => arr[randInt(0, arr.length-1)];
  const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a || 1; };

  function reduceFrac(n,d){
    if(d<0){n=-n;d=-d;}
    const g = gcd(n,d);
    return [n/g, d/g];
  }
  function fracDisplay(n,d){
    [n,d]=reduceFrac(n,d);
    if(d===1) return `${n}`;
    return `<sup>${n}</sup>&frasl;<sub>${d}</sub>`;
  }
  function parseFracInput(str){
    str = str.trim().replace(/\s+/g,' ');
    if(str==='') return null;
    let m = str.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
    if(m){
      const whole=parseInt(m[1],10), n=parseInt(m[2],10), d=parseInt(m[3],10);
      if(d===0) return null;
      const sign = whole<0 ? -1:1;
      return [sign*(Math.abs(whole)*d+n), d];
    }
    m = str.match(/^(-?\d+)\/(-?\d+)$/);
    if(m){
      const n=parseInt(m[1],10), d=parseInt(m[2],10);
      if(d===0) return null;
      return [n,d];
    }
    m = str.match(/^(-?\d+)$/);
    if(m) return [parseInt(m[1],10), 1];
    return null;
  }

  /* ---------------- generators (10 關卡) ---------------- */

  function genAdd(diff){
    let a,b,extra=null;
    if(diff==='easy'){a=randInt(1,20);b=randInt(1,20);}
    else if(diff==='normal'){a=randInt(10,99);b=randInt(10,99);}
    else {a=randInt(100,999);b=randInt(100,999);extra=randInt(1,99);}
    const ans = extra===null ? a+b : a+b+extra;
    const text = extra===null ? `${a} + ${b}` : `${a} + ${b} + ${extra}`;
    return mkNum(text, ans);
  }
  function genSub(diff){
    let a,b;
    if(diff==='easy'){a=randInt(5,20);b=randInt(0,a);}
    else if(diff==='normal'){a=randInt(20,99);b=randInt(0,a);}
    else {a=randInt(100,999);b=randInt(0,a);}
    return mkNum(`${a} − ${b}`, a-b);
  }
  function genMul(diff){
    let a,b;
    if(diff==='easy'){a=randInt(1,9);b=randInt(1,9);}
    else if(diff==='normal'){a=randInt(10,99);b=randInt(2,9);}
    else {a=randInt(11,99);b=randInt(11,99);}
    return mkNum(`${a} × ${b}`, a*b);
  }
  function genDiv(diff){
    let divisor,quotient;
    if(diff==='easy'){divisor=randInt(2,9);quotient=randInt(1,9);}
    else if(diff==='normal'){divisor=randInt(2,9);quotient=randInt(10,99);}
    else {divisor=randInt(11,99);quotient=randInt(11,99);}
    const dividend = divisor*quotient;
    return mkNum(`${dividend} ÷ ${divisor}`, quotient);
  }
  function genSum10(diff){
    if(diff==='easy'){
      const a = randInt(1,9);
      return mkNum(`${a} + ? = 10`, 10-a);
    } else if(diff==='normal'){
      const a = randInt(0,10);
      return mkNum(`? + ${a} = 10`, 10-a);
    } else {
      const a = randInt(1,6), b=randInt(1,9-a);
      return mkNum(`${a} + ${b} + ? = 10`, 10-a-b);
    }
  }
  function genSum100(diff){
    if(diff==='easy'){
      const a = randInt(1,9)*10;
      return mkNum(`${a} + ? = 100`, 100-a);
    } else if(diff==='normal'){
      const a = randInt(1,99);
      return mkNum(`${a} + ? = 100`, 100-a);
    } else {
      const a = randInt(1,50), b = randInt(1,99-a);
      return mkNum(`${a} + ${b} + ? = 100`, 100-a-b);
    }
  }
  const SPEED_TIPS = {
    5:'小技巧：×5 = ×10 ÷ 2',
    25:'小技巧：×25 = ×100 ÷ 4',
    125:'小技巧：×125 = ×1000 ÷ 8'
  };
  function genSpeed(diff){
    let n, mult, op;
    if(diff==='easy'){ n=randInt(10,99); mult=choice([5,25]); }
    else if(diff==='normal'){ n=randInt(100,999); mult=choice([5,25,125]); }
    else { n=randInt(1000,9999); mult=choice([25,125]); }
    op = choice(['×','÷']);
    let text, ans;
    if(op==='×'){
      text = `${n} × ${mult}`;
      ans = n*mult;
    } else {
      const base = randInt(diff==='easy'?2:diff==='normal'?10:100, diff==='easy'?40:diff==='normal'?400:999);
      const dividend = base*mult;
      text = `${dividend} ÷ ${mult}`;
      ans = base;
    }
    const q = mkNum(text, ans);
    q.hint = SPEED_TIPS[mult];
    return q;
  }
  function genFrac(diff){
    let d1,d2,n1,n2,op;
    if(diff==='easy'){
      d1 = randInt(2,8); d2 = d1;
      n1 = randInt(1,d1-1); n2 = randInt(1,d1-1);
      op = choice(['+','-']);
      if(op==='-' && n1<n2) [n1,n2]=[n2,n1];
    } else if(diff==='normal'){
      d1 = randInt(2,10); d2 = randInt(2,10);
      n1 = randInt(1,d1-1); n2 = randInt(1,d2-1);
      op = choice(['+','-','×']);
      if(op==='-' && (n1/d1) < (n2/d2)) { [n1,d1,n2,d2] = [n2,d2,n1,d1]; }
    } else {
      d1 = randInt(2,12); d2 = randInt(2,12);
      n1 = randInt(1,d1-1); n2 = randInt(1,d2-1);
      op = choice(['+','-','×','÷']);
      if(op==='-' && (n1/d1) < (n2/d2)) { [n1,d1,n2,d2] = [n2,d2,n1,d1]; }
    }
    let rn, rd;
    if(op==='+'){ rn = n1*d2 + n2*d1; rd = d1*d2; }
    else if(op==='-'){ rn = n1*d2 - n2*d1; rd = d1*d2; }
    else if(op==='×'){ rn = n1*n2; rd = d1*d2; }
    else { rn = n1*d2; rd = d1*n2; }
    [rn, rd] = reduceFrac(rn, rd);
    const text = `${fracDisplay(n1,d1)} ${op} ${fracDisplay(n2,d2)}`;
    return {
      text, answerText: rd===1? `${rn}` : `${rn}/${rd}`, kind:'frac',
      check(input){
        const p = parseFracInput(input);
        if(!p) return false;
        const [un,ud] = reduceFrac(p[0],p[1]);
        return un===rn && ud===rd;
      }
    };
  }
  function genDec(diff){
    let a,b,op,places;
    if(diff==='easy'){
      places=1;
      a = randInt(1,99)/10; b = randInt(1,99)/10;
      op = choice(['+','-']);
      if(op==='-' && a<b) [a,b]=[b,a];
    } else if(diff==='normal'){
      places=2;
      a = randInt(1,999)/100; b = randInt(1,999)/100;
      op = choice(['+','-']);
      if(op==='-' && a<b) [a,b]=[b,a];
    } else {
      places=1;
      op = choice(['×','÷']);
      if(op==='×'){
        a = randInt(1,99)/10; b = randInt(2,12);
      } else {
        b = randInt(2,9);
        const quotient = randInt(1,99)/10;
        a = Math.round(quotient*b*10)/10;
      }
    }
    let ans;
    if(op==='+') ans = a+b;
    else if(op==='-') ans = a-b;
    else if(op==='×') ans = a*b;
    else ans = a/b;
    const outPlaces = (op==='×') ? 2 : (op==='÷') ? 1 : places;
    ans = Math.round(ans*Math.pow(10,outPlaces))/Math.pow(10,outPlaces);
    const bStr = op==='×' ? b.toFixed(0) : op==='÷' ? b.toFixed(0) : b.toFixed(places);
    const text = `${op==='÷'?a.toFixed(1):a.toFixed(op==='×'?1:places)} ${op} ${bStr}`;
    return mkDec(text, ans, outPlaces);
  }
  function signed(x){ return x<0 ? `(${x})` : `${x}`; }
  function genJr(diff){
    const patterns = [];
    if(diff==='easy'){
      patterns.push(()=>{
        const a=randInt(-20,20), b=randInt(-20,20);
        const op = choice(['+','-']);
        const ans = op==='+' ? a+b : a-b;
        return [`${a} ${op==='+'?'+':'−'} ${signed(b)}`, ans];
      });
    } else if(diff==='normal'){
      patterns.push(()=>{
        const a=randInt(-12,12), b=randInt(-12,12), c=randInt(-12,12);
        const useParen = Math.random()<0.5;
        if(useParen){
          const ans=(a+b)*c;
          return [`(${a} + ${signed(b)}) × ${signed(c)}`, ans];
        } else {
          const ans=a+b*c;
          return [`${a} + ${signed(b)} × ${signed(c)}`, ans];
        }
      });
    } else {
      patterns.push(()=>{
        const a=randInt(-9,9);
        const b=randInt(-15,15);
        const ans = a*a + b;
        return [`${signed(a)}<sup>2</sup> + ${signed(b)}`, ans];
      });
      patterns.push(()=>{
        const a=randInt(-15,15), b=randInt(-15,15);
        const ans = Math.abs(a-b);
        return [`|${a} − ${signed(b)}|`, ans];
      });
      patterns.push(()=>{
        const a=randInt(-12,12), b=randInt(-12,12), c=randInt(2,9);
        const ans = (a+b)*c - c;
        return [`(${a} + ${signed(b)}) × ${c} − ${c}`, ans];
      });
    }
    const [text, ans] = choice(patterns)();
    return mkNum(text, ans);
  }
  function mkNum(text, ans){
    return { text, answerText:`${ans}`, kind:'int', check(input){ const v=parseInt(input.trim(),10); return !isNaN(v) && v===ans; } };
  }
  function mkDec(text, ans, places){
    return { text, answerText: ans.toFixed(places), kind:'dec', check(input){
      const v = parseFloat(input.trim().replace(',', '.'));
      if(isNaN(v)) return false;
      return Math.abs(v-ans) < (0.5/Math.pow(10,places));
    }};
  }

  /* ---------------- game logic ---------------- */

  function startRound(modeId, diff){

  function startTimer(){

  function submitAnswer(){
    if(!state.active) return;
    const q = state.current;

    const val = answerInput.value;
    if(val.trim()==='') { answerInput.focus(); return; }
    const ok = q.check(val);

      state.correct++; state.score += 2;
      feedbackEl.textContent='答對了！+2 分';

  /* ---------------- numpad ---------------- */
  function buildNumpad(kind){
    numpad.innerHTML='';
    const addKey = (label, action, variant)=>{
      const b=document.createElement('button');
      b.textContent=label;
      if(variant==='full') b.classList.add('full');
      b.addEventListener('click', ()=>{ action(); answerInput.focus(); });
      numpad.appendChild(b);
    };
    for(let i=1;i<=9;i++) addKey(String(i), ()=>{ answerInput.value += String(i); });
    if(kind==='neg') addKey('−', ()=>{ answerInput.value = answerInput.value.startsWith('-') ? answerInput.value.slice(1) : '-'+answerInput.value; });
    else if(kind==='frac') addKey('/', ()=>{ answerInput.value += '/'; });
    else if(kind==='dec') addKey('.', ()=>{ answerInput.value += '.'; });
    else addKey('00', ()=>{ answerInput.value += '00'; });
    addKey('0', ()=>{ answerInput.value += '0'; });
    addKey('⌫', ()=>{ answerInput.value = answerInput.value.slice(0,-1); });
    addKey('送出', submitAnswer, 'full');
  }

  async function loadAdmin(){
    const {records, source} = await getAllRecords(ADMIN_PASSWORD);
    adminRecordsCache = records.slice().sort((a,b)=> new Date(b.time)-new Date(a.time));
    const modeSel = $('#adminFilterMode');
    const modes = [...new Set(adminRecordsCache.map(r=>r.mode))];
    modeSel.innerHTML = '<option value="">全部關卡</option>' + modes.map(m=>`<option value="${m}">${m}</option>`).join('');
    renderAdminTable();
    $('#adminSummary').innerHTML = `<div>資料來源 <b>${source==='cloud'?'☁️ 雲端':'💾 本機'}</b></div>
      <div>總場次 <b>${adminRecordsCache.length}</b></div>
      <div>不重複玩家 <b>${new Set(adminRecordsCache.map(r=>r.name)).size}</b></div>`;
  }
  function renderAdminTable(){
    const nameFilter = $('#adminFilterName').value.trim().toLowerCase();
    const modeFilter = $('#adminFilterMode').value;
    const rows = adminRecordsCache.filter(r=>
      (!nameFilter || (r.name||'').toLowerCase().includes(nameFilter)) &&
      (!modeFilter || r.mode===modeFilter)
    );
    $('#adminRows').innerHTML = rows.map(r=>`
      <tr>
        <td>${formatTime(r.time)}</td>
        <td>${escapeHtml(r.name||'')}</td>
        <td>${escapeHtml(r.mode||'')}</td>
        <td>${escapeHtml(r.difficulty||'')}</td>
        <td>${r.score}</td>
        <td>${escapeHtml(r.badge||'')}</td>
        <td>${r.correct}</td>
        <td>${r.wrong}</td>
        <td>${r.total}</td>
      </tr>
    `).join('') || '<tr><td colspan="9" style="text-align:center;color:var(--ink-soft);padding:20px;">沒有符合的紀錄</td></tr>';
  }
  function formatTime(iso){
    try{
      const d = new Date(iso);
      return d.toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
    }catch(e){ return iso||''; }
  }
  $('#adminFilterName').addEventListener('input', renderAdminTable);
  $('#adminFilterMode').addEventListener('change', renderAdminTable);
  $('#adminRefresh').addEventListener('click', loadAdmin);
  $('#adminExport').addEventListener('click', ()=>{
    const header = ['時間','姓名','關卡','難度','分數','牌位','答對','答錯','總題數'];
    const lines = [header.join(',')].concat(adminRecordsCache.map(r=>[
      formatTime(r.time), r.name, r.mode, r.difficulty, r.score, r.badge, r.correct, r.wrong, r.total
    ].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')));
    const csv = '\uFEFF' + lines.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `數學練習場紀錄_${Date.now()}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

})();
</script>
</body>
</html>
